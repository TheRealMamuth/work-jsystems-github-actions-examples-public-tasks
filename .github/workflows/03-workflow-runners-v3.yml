name: 03 - Workflow Runners v3

on:
  workflow_dispatch:

jobs:
  ubuntu-echo-01:
    runs-on: lab
    steps:
      - name: Show OS
        shell: bash
        run: |
          echo "This job is running on an Ubuntu runner."
          echo "$RUNNER_OS"
      - name: Create file
        shell: bash
        run: |
          echo "This is a test file." > /home/student/testfile.txt

  ubuntu-echo-02:
    needs: ubuntu-echo-01
    runs-on: lab
    steps:
      - name: Show OS
        shell: bash
        run: |
          echo "This job is running on an Ubuntu runner."
          echo "$RUNNER_OS"

      - name: Read file
        shell: bash
        run: |
          if [ -f /home/student/testfile.txt ]; then
            echo "File exists. Contents:"
            cat /home/student/testfile.txt
          else
            echo "File does not exist."
          fi
      

  windows-echo:
    runs-on: windows-latest
    steps:
      - name: Show OS
        run: |
          echo "This job is running on a Windows runner."
          echo $env:RUNNER_OS

  mac-echo:
    runs-on: macos-latest
    steps:
      - name: Show OS
        shell: bash
        run: |
          echo "This job is running on a MacOS runner."
          echo "$RUNNER_OS"
