name: 06-06c Pogoda API CI + deploy

on:
  push:
    branches: [ feature/06-pogoda-api ]
  pull_request:
    branches: [ feature/06-pogoda-api ]
  workflow_dispatch:

env:
  WORKDIR: ./CWICZENIA/06-context/pogoda_python_flusk
  TEST_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/python_pogoda
  HUB_IMAGE_BASE: ${{ secrets.DOCKERHUB_USERNAME }}/python_pogoda
  DOCKERHUB_TAG: latest
  DOCKER_PORT_EXTERNAL: 18000

jobs:
  # =====================
  # 1. BUILD JOB
  # =====================
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local test image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.WORKDIR }}
          tags: ${{ env.TEST_IMAGE }}:${{ env.DOCKERHUB_TAG }}
          load: true        # obraz załadowany do lokalnego dockera
          push: false

      - name: Save image to tar
        run: |
          docker save "${{ env.TEST_IMAGE }}:${{ env.DOCKERHUB_TAG }}" -o image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: pogoda-image
          path: image.tar

  # =====================
  # 2. TEST JOB
  # =====================
  test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: pogoda-image

      - name: Load Docker image
        run: |
          docker load -i image.tar

      - name: Run container
        run: |
          docker run -d \
            --name pogoda_api \
            -p 8000:8000 \
            -e OPENWEATHER_API_KEY="${{ secrets.OPENWEATHER_API_KEY }}" \
            "${{ env.TEST_IMAGE }}:${{ env.DOCKERHUB_TAG }}"

      - name: Wait for API to be ready
        run: |
          echo "Czekam na start API..."
          sleep 10

      - name: Test /weather endpoint via curl
        run: |
          set -e
          echo "Testowanie endpointu /weather..."
          curl -f "http://localhost:8000/weather?city=Warsaw&api_key=${{ secrets.OPENWEATHER_API_KEY }}"
          echo
          echo "OK - endpoint /weather zwrócił odpowiedź 2xx."

      - name: Show container logs (for debug on failure)
        if: failure()
        run: |
          echo "Logi kontenera:"
          docker logs pogoda_api || true

      - name: Stop container
        if: always()
        run: |
          docker stop pogoda_api || true
          docker rm pogoda_api || true

  # =====================
  # 3. BUILD & PUSH (RELEASE) JOB
  # =====================
  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/06-pogoda-api'
    outputs:
      image_digest: ${{ steps.publish.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push image to Docker Hub
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.WORKDIR }}
          push: true
          tags: |
            ${{ env.HUB_IMAGE_BASE }}:${{ env.DOCKERHUB_TAG }}
            ${{ env.HUB_IMAGE_BASE }}:${{ github.sha }}

  # =====================
  # 4. DEPLOY JOB (STAŁY KONTENER NA RUNNERZE SELF-HOSTED)
  # =====================
  # Kolejny deploy zastępuje kontener, który pozostaje uruchomiony po jobie.
  deploy:
    runs-on: [self-hosted, linux]
    needs: build-and-push
    timeout-minutes: 5
    concurrency:
      group: pogoda-api-deploy
      cancel-in-progress: false
    env:
      IMAGE_DIGEST: ${{ needs.build-and-push.outputs.image_digest }}

    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull published image from Docker Hub
        run: |
          # Digest wskazuje dokładnie obraz z poprzedniego joba,
          # nawet jeśli tag latest zostanie w międzyczasie nadpisany.
          test -n "$IMAGE_DIGEST"
          docker pull "${HUB_IMAGE_BASE}@${IMAGE_DIGEST}"

      - name: Remove previous deployment container if it exists
        run: |
          # Uwzględnij także zatrzymany kontener i dopasuj tylko pełną nazwę.
          existing_container="$(docker container ls --all --quiet --filter 'name=^/pogoda_api_deploy$')"
          if [ -n "$existing_container" ]; then
            docker rm --force "$existing_container"
          fi

      - name: Run published container
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
        run: |
          docker run -d \
            --name pogoda_api_deploy \
            --restart unless-stopped \
            -p ${{ env.DOCKER_PORT_EXTERNAL }}:8000 \
            -e OPENWEATHER_API_KEY \
            "${HUB_IMAGE_BASE}@${IMAGE_DIGEST}"

      - name: Verify deployed API is ready
        run: |
          # Lokalna kontrola startu FastAPI, bez wywoływania dostawcy pogody.
          curl --fail --silent --show-error \
            --retry 15 --retry-all-errors --retry-delay 2 \
            --retry-max-time 60 --max-time 5 \
            --output /dev/null \
            http://127.0.0.1:${{ env.DOCKER_PORT_EXTERNAL }}/openapi.json
          test "$(docker inspect --format '{{.State.Running}}' pogoda_api_deploy)" = true
          echo "Kontener pobrany z Docker Hub działa, a API odpowiada."

      - name: Test deployed /weather endpoint via curl
        run: |
          echo "Testowanie wdrożonego endpointu /weather..."
          # Aplikacja korzysta z OPENWEATHER_API_KEY przekazanego do kontenera.
          curl --fail --silent --show-error --max-time 30 \
            "http://127.0.0.1:${DOCKER_PORT_EXTERNAL}/weather?city=Warsaw"
          echo
          echo "OK - wdrożony endpoint /weather zwrócił odpowiedź bez błędu HTTP."

      - name: Show deployed container logs on failure
        if: failure()
        run: docker logs pogoda_api_deploy || true
