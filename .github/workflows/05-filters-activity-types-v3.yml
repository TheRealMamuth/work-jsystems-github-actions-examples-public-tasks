name: 05 - CI for "05-usung-filters-and-activity-types"

on:
  push:
    branches: [CW05]
    paths-ignore:
      - 'CWICZENIA/05-usung-filters-and-activity-types/dokumentacja/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'CWICZENIA/05-usung-filters-and-activity-types/dokumentacja/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: CWICZENIA/05-usung-filters-and-activity-types
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          package-manager-cache: false
      - name: Instalacja zależności
        run: npm ci --include=dev
      - name: Testy
        run: npm test
      - name: Build
        run: npm run build
