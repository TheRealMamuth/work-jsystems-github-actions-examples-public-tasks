worker_processes auto;
pid /tmp/weather-nginx/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    keepalive_timeout 30;
    client_max_body_size 16k;
    client_body_temp_path /tmp/weather-nginx/client;
    proxy_temp_path /tmp/weather-nginx/proxy;
    fastcgi_temp_path /tmp/weather-nginx/fastcgi;
    uwsgi_temp_path /tmp/weather-nginx/uwsgi;
    scgi_temp_path /tmp/weather-nginx/scgi;

    server {
        listen 8080;
        server_name _;
        include /app/nginx/proxy.conf;
    }

    # OPTIONAL_TLS_SERVER
}
