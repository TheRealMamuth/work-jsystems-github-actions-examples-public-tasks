name: 14 - Working with Artifacts

on: workflow_dispatch

permissions:
  contents: read

env:
  CI: 'true'
  build-artifact-key: app-${{ github.sha }}
  test-coverage-key: test-coverage-${{ github.sha }}

jobs:
  test-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CWICZENIA/14-artifacts/react-app
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Node
        id: node
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          package-manager-cache: false
      - name: Download cached dependencies
        uses: actions/cache@v6
        id: cache
        with:
          path: CWICZENIA/14-artifacts/react-app/node_modules
          key: react-deps-v2-${{ runner.os }}-${{ runner.arch }}-node-${{ steps.node.outputs.node-version }}-${{ hashFiles('CWICZENIA/14-artifacts/react-app/package-lock.json') }}
      - name: Install dependencies
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        run: npm ci --include=dev
      - name: Unit tests
        id: tests
        run: npm test -- --coverage
      - name: Upload test results
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.test-coverage-key }}
          path: CWICZENIA/14-artifacts/react-app/coverage
          if-no-files-found: error
      - name: Build code
        run: npm run build
      - name: Upload build files
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.build-artifact-key }}
          path: CWICZENIA/14-artifacts/react-app/build
          if-no-files-found: error
  deploy:
    runs-on: ubuntu-latest
    needs: test-build
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.build-artifact-key }}
          path: build
      - name: Verify build artifact
        run: test -f build/index.html
      - name: Show folder structure
        run: ls -R build
