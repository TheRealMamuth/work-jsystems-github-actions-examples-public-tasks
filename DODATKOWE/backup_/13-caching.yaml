name: 13 - Using Caching

on:
  workflow_dispatch:
    inputs:
      use-cache:
        description: Whether to execute cache steps
        type: boolean
        default: true
      node-version:
        description: Node version supported by Vite and Vitest
        type: choice
        options:
          - 22.x
          - 24.x
        default: 24.x

permissions:
  contents: read

env:
  CI: 'true'

jobs:
  install-deps:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CWICZENIA/13-caching/react-app
    outputs:
      deps-cache-key: ${{ steps.cache-key.outputs.CACHE_KEY }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Node
        id: node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          package-manager-cache: false
      - name: Calculate cache key
        id: cache-key
        env:
          CACHE_KEY: react-deps-v2-${{ runner.os }}-${{ runner.arch }}-node-${{ steps.node.outputs.node-version }}-${{ hashFiles('CWICZENIA/13-caching/react-app/package-lock.json') }}
        run: echo "CACHE_KEY=$CACHE_KEY" >> "$GITHUB_OUTPUT"
      - name: Download cached dependencies
        if: ${{ inputs.use-cache }}
        id: cache
        uses: actions/cache@v6
        with:
          path: CWICZENIA/13-caching/react-app/node_modules
          key: ${{ steps.cache-key.outputs.CACHE_KEY }}
      - name: Install dependencies
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        run: npm ci --include=dev
  lint-test:
    runs-on: ubuntu-latest
    needs: install-deps
    defaults:
      run:
        working-directory: CWICZENIA/13-caching/react-app
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          package-manager-cache: false
      - name: Download cached dependencies
        if: ${{ inputs.use-cache }}
        id: cache
        uses: actions/cache@v6
        with:
          path: CWICZENIA/13-caching/react-app/node_modules
          key: ${{ needs.install-deps.outputs.deps-cache-key }}
      - name: Install dependencies on cache miss or when cache is disabled
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        run: npm ci --include=dev
      - name: Typecheck
        run: npm run typecheck
      - name: Testing
        run: npm test
  build:
    runs-on: ubuntu-latest
    needs: install-deps
    defaults:
      run:
        working-directory: CWICZENIA/13-caching/react-app
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          package-manager-cache: false
      - name: Download cached dependencies
        if: ${{ inputs.use-cache }}
        id: cache
        uses: actions/cache@v6
        with:
          path: CWICZENIA/13-caching/react-app/node_modules
          key: ${{ needs.install-deps.outputs.deps-cache-key }}
      - name: Install dependencies on cache miss or when cache is disabled
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        run: npm ci --include=dev
      - name: Building
        run: npm run build
